[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haze-model"
version = "0.1.0"
description = "The learned haze forecast: truth, features, training, backtest and the forecast service"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.1",
    "lightgbm>=4.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
hazemodel = "hazemodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# SQL strings and the docstring command line read better unwrapped.
"src/hazemodel/store.py" = ["E501"]
"tests/fixtures/extract.py" = ["E501"]
