# The whole app in one command, from the repository root:
#
#   cp .env.example .env        # paste the token from `claude setup-token`
#   docker compose up -d --build
#
# Then open http://localhost:3000. The first data cycle fetches a week of DOE
# readings and takes a few minutes; `docker compose logs -f jobs` shows it.
#
# For host development (`pnpm dev`, `pnpm test`) start only the infrastructure:
#
#   docker compose up -d postgres llm-proxy
#
# Every published port binds to host loopback, because nothing here
# authenticates anyone.

name: when-haze-stop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localdev
    # 5433 so it cannot collide with a Postgres already on 5432. The backend
    # tests create and use `haze_test` in this instance.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The one door to the models: `claude -p` logged in by CLAUDE_CODE_OAUTH_TOKEN
  # from .env. Without the token it still starts and every Claude call is
  # refused as "not logged in"; the map and alerts do not need it.
  llm-proxy:
    build: ./proxy
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # 4001 on the host, because 4000 is often another project's proxy.
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: &backend-env
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: postgres
      PG_USER: postgres
      PG_PASSWORD: localdev
      LLM_PROXY_URL: http://llm-proxy:4000
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["node", "db/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *backend-env
      # The container's own interface, so the frontend container can reach it.
      # Published to host loopback only.
      HOST: 0.0.0.0
      PORT: 8091
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      migrate:
        condition: service_completed_successfully
      llm-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  # The hourly fetch, model run and alert pass: one cycle now so the map has
  # data, a backfill of the stored week (it skips hours already run, so a
  # restart costs little), then a cycle at 20 past every hour.
  jobs:
    build: ./backend
    environment: *backend-env
    command: ["node", "--import", "tsx", "src/jobs/main.ts", "loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8091
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
